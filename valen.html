<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Form ❤️</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
            background-image: url('https://i.imgur.com/JWiu47D.jpeg'); /* Your image as background */
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
        }

        .love-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d63384;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .btn-custom {
            width: 150px;
            font-size: 1.2rem;
            margin: 10px;
            transition: transform 0.2s ease, background-color 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.1);
            background-color: #c82333;
        }

        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

        .fade-in {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .fade-in.active {
            opacity: 1;
        }

        /* Container Styling */
        .container {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white background */
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 3rem;
            color: #d63384;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card {
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- Main Content -->
    <div class="container text-center mt-5">
        <h1>💕 Be My Valentine 💕</h1>
        <p class="lead love-text fade-in active" id="question-text">Answer this with love! 😊</p>
        <div class="card p-4 shadow-lg fade-in active" id="question-card">
            <div id="question-container">
                <button class="btn btn-danger btn-custom" onclick="nextQuestion(1)">Yes</button>
                <button class="btn btn-danger btn-custom" onclick="nextQuestion(1)">YES!!!!!</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const questions = [
            "Do you love me more than sugars? 🍬",
            "Will you be my Valentine today and forever? 💘",
            "Am I the best cuddler in the world? 🤗❤️",
            "Can I have unlimited kisses from you? 😘💋",
            "I love you! 💖"
        ];
        const answers = [
            ["Yes", "YES!!!!!"],
            ["Yes", "YES!!!!!"],
            ["Yes", "YES!!!!!"],
            ["Yes", "YES!!!!!"],
            ["I love you too", "ILOVEYOUSOMUCH"]
        ];
        let currentQuestion = 0;

        function nextQuestion(next) {
            let questionText = document.getElementById("question-text");
            let questionCard = document.getElementById("question-card");
            let btnContainer = document.getElementById("question-container");

            // Fade out animation
            questionText.classList.add("fade-out");
            questionCard.classList.add("fade-out");

            setTimeout(() => {
                currentQuestion = next;

                if (currentQuestion < questions.length) {
                    // Update question and buttons
                    questionText.innerText = questions[currentQuestion];
                    btnContainer.innerHTML = '';
                    answers[currentQuestion].forEach(answer => {
                        let btn = document.createElement("button");
                        btn.className = "btn btn-danger btn-custom";
                        btn.innerText = answer;
                        btn.onclick = () => nextQuestion(currentQuestion + 1);
                        btnContainer.appendChild(btn);
                    });
                } else {
                    // Final message
                    document.querySelector(".card").innerHTML = `
                        <h2 class='text-success'>My Love, 💖</h2>
                        <p class='love-text'>
                            You are the most precious part of my life. Every moment with you is a beautiful memory, 
                            and every smile of yours lights up my world. I promise to love, cherish, and adore you forever. 
                            Thank you for being my Valentine, today and always! 💕
                        </p>`;
                }

                // Fade in animation
                questionText.classList.remove("fade-out");
                questionCard.classList.remove("fade-out");
                questionText.classList.add("fade-in", "active");
                questionCard.classList.add("fade-in", "active");
            }, 500);
        }
    </script>
</body>
</html>
