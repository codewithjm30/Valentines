<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Form ❤️</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe4e1;
        }
        .welcome-text {
            font-size: 2rem;
            font-weight: bold;
            color: #d63384;
        }
        .btn-custom {
            width: auto;
            min-width: 100px;
            padding: 10px 20px;
            font-size: 1rem;
            margin: 5px;
            transition: transform 0.2s ease, background-color 0.3s;
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 10px;
            text-align: center;
            display: inline-block;
        }
        .btn-custom:hover {
            transform: scale(1.1);
            background-color: #ff4757;
        }
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .video-background video {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .love-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: black;
            text-shadow: none;
            background: rgba(255, 182, 193, 0.5);
            border: 2px solid rgba(255, 105, 180, 0.7);
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }
        .card {
            background: rgba(255, 182, 193, 0.5);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 400px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="welcome-container" id="welcome-page">
        <img src="https://i.imgur.com/3HvLni3.jpeg" alt="Teddy Bear" width="200">
        <p class="welcome-text">ITS VALENTINE SEASON! 💖</p>
        <button class="btn-custom" onclick="startQuestions()">NEXT</button>
    </div>
    <div class="container text-center mt-5" id="question-page" style="display: none;">
        <div class="video-background">
            <video autoplay muted loop>
                <source src="https://i.imgur.com/DMWqOdS.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <p id="question-text" class="lead love-text">Answer this with love! 😊Will you be my Valentine?</p>
        <div class="card p-4 shadow-lg">
            <div id="question-container">
                <button class="btn btn-custom" onclick="nextQuestion(1)">Yes</button>
                <button class="btn btn-custom" onclick="nextQuestion(1)">YES!!!!!</button>
            </div>
        </div>
    </div>
    <script>
        function startQuestions() {
            document.getElementById("welcome-page").style.display = "none";
            document.getElementById("question-page").style.display = "block";
        }
        const questions = [
            "Will you be my Valentine? ❤️",
            "Kung paliton tika ug fried chicken, mas love mo ko o ang chicken? 💘",
            "Ikaw ba ang nag-imbento sa gravity? Kay mura man gud kog nahulog nimo!? AHAAHAHAHAHAHAHAHHA🤗❤️",
            "Sweets or ME ? 😘💋",
            "Kung ang gugma nato murag construction project, musugot ka nga forever under maintenance? 😘💋",
            "I love you BABYYYY! 💖"
        ];
        const answers = [
            ["Yes", "YESSSSSS"],
            ["IKAW", "IKAW"],
            ["Oo", "EY HAHAHAHA"],
            ["IKAW", "BOTHHHH"],
            ["SHESHHHHH", "HAAHAHAHAHAHA"],
            ["I love you too", "ILOVEYOUSOMUCH"]
        ];
        function nextQuestion(next) {
            let questionText = document.getElementById("question-text");
            let questionContainer = document.getElementById("question-container");
            questionText.innerText = questions[next] || "";
            questionContainer.innerHTML = '';
            if (next < questions.length) {
                answers[next].forEach(answer => {
                    let btn = document.createElement("button");
                    btn.className = "btn btn-custom";
                    btn.innerText = answer;
                    btn.onclick = () => nextQuestion(next + 1);
                    questionContainer.appendChild(btn);
                });
            } else {
                document.querySelector(".card").innerHTML = `
                    <h2 class='text-danger'>My Love, 💖</h2>
                    <p class='love-text'>
                        You are the most amazing girlfriend anyone could ever ask for! 
                        Thank you for always being there, for your endless love, and for making my life so much brighter. 
                        You are my happiness, my strength, and my greatest blessing. 
                        I promise to cherish you, love you endlessly, and always make you feel special. 💕
                    </p>`;
            }
        }
    </script>
</body>
</html>
